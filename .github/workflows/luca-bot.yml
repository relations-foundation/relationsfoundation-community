name: Luca Bot

# Lives here (not in relationsfoundation.org) because GitHub Actions
# discussion/discussion_comment events only trigger workflows defined in the
# same repo where the discussion happens — and discussions moved here
# 2026-07-20 so relationsfoundation.org could go private without breaking
# giscus (giscus requires the mapped repo to be public). See
# relationsfoundation.org/AGENTS.md § Luca Bot Integration for the full
# picture; PR creation still targets relationsfoundation.org via
# WEBSITE_REPO_OWNER/WEBSITE_REPO_NAME in github_apply.py.

on:
  discussion:
    types: [created]
  discussion_comment:
    types: [created]

permissions:
  discussions: write
  contents: write
  pull-requests: write

# Serialise all jobs for one discussion. giscus's first comment on a page
# fires a `discussion` (created) event AND a `discussion_comment` (created)
# event ~2s apart; without this they run concurrently and can each create a
# duplicate suggestion issue before either sees the other's. Non-cancelling
# so an in-flight run finishes before the next starts.
concurrency:
  group: luca-bot-${{ github.event.discussion.number }}
  cancel-in-progress: false

jobs:

  # ── reply ─────────────────────────────────────────────────────────────────
  # Fires when @luca is mentioned in a new discussion or any comment.
  reply:
    runs-on: ubuntu-latest
    if: |
      github.actor != 'github-actions[bot]' && (
        contains(github.event.comment.body, '@luca') ||
        contains(github.event.discussion.body, '@luca')
      )

    steps:
      - name: Checkout website repo
        uses: actions/checkout@v4.2.2
        with:
          repository: relations-foundation/relationsfoundation.org
          token: ${{ secrets.LUCA_BOT_PAT }}

      - name: Checkout luca-bot
        uses: actions/checkout@v4.2.2
        with:
          repository: relations-foundation/luca-bot
          path: luca-bot
          token: ${{ secrets.LUCA_BOT_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic
        working-directory: luca-bot

      - name: Run Luca reply
        working-directory: luca-bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCUSSION_NODE_ID: ${{ github.event.discussion.node_id }}
          DISCUSSION_NUMBER: ${{ github.event.discussion.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          TRIGGERING_BODY: ${{ github.event.comment.body || github.event.discussion.body }}
          DISCUSSION_TITLE: ${{ github.event.discussion.title }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          WEBSITE_ROOT: ${{ github.workspace }}
        run: python github_discussion.py

  # ── suggest ───────────────────────────────────────────────────────────────
  # Fires on any new comment that is NOT an @luca mention, NOT a /luca command,
  # and NOT a review-pass phrase. Classifies it and, if it proposes a concrete
  # page change, opens (or supersedes) a PR on relationsfoundation.org with the
  # change drafted — merge = accept, close = reject. See luca-bot#19
  # (Revision 2: PR directly, no intermediate issue).
  suggest:
    runs-on: ubuntu-latest
    # discussion_comment only: giscus posts the user's text as a comment, not
    # the discussion body. The `discussion` (created) event carries only a
    # giscus placeholder body and is actored by giscus[bot].
    if: |
      github.event_name == 'discussion_comment' &&
      github.actor != 'github-actions[bot]' &&
      github.actor != 'giscus[bot]' &&
      !contains(github.event.comment.body, '<!-- luca-bot -->') &&
      !contains(github.event.comment.body, '@luca') &&
      !startsWith(github.event.comment.body, '/luca') &&
      !contains(github.event.comment.body, 'reviewed #')

    steps:
      - name: Checkout website repo
        uses: actions/checkout@v4.2.2
        with:
          repository: relations-foundation/relationsfoundation.org
          token: ${{ secrets.LUCA_BOT_PAT }}

      - name: Checkout luca-bot
        uses: actions/checkout@v4.2.2
        with:
          repository: relations-foundation/luca-bot
          path: luca-bot
          token: ${{ secrets.LUCA_BOT_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic
        working-directory: luca-bot

      - name: Run Luca suggest
        working-directory: luca-bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LUCA_BOT_PAT: ${{ secrets.LUCA_BOT_PAT }}
          DISCUSSION_NODE_ID: ${{ github.event.discussion.node_id }}
          DISCUSSION_NUMBER: ${{ github.event.discussion.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          TRIGGERING_BODY: ${{ github.event.comment.body || github.event.discussion.body }}
          DISCUSSION_TITLE: ${{ github.event.discussion.title }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          WEBSITE_ROOT: ${{ github.workspace }}
        run: python github_suggest.py

  # ── apply ─────────────────────────────────────────────────────────────────
  # Fires when tvc-amaffei posts "/luca apply".
  # Synthesises the full thread into a website PR; archives the discussion.
  apply:
    runs-on: ubuntu-latest
    if: |
      github.actor == 'tvc-amaffei' &&
      github.event_name == 'discussion_comment' &&
      startsWith(github.event.comment.body, '/luca apply')

    steps:
      - name: Checkout website repo
        uses: actions/checkout@v4.2.2
        with:
          repository: relations-foundation/relationsfoundation.org
          token: ${{ secrets.LUCA_BOT_PAT }}

      - name: Checkout luca-bot
        uses: actions/checkout@v4.2.2
        with:
          repository: relations-foundation/luca-bot
          path: luca-bot
          token: ${{ secrets.LUCA_BOT_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic
        working-directory: luca-bot

      - name: Run Luca apply
        working-directory: luca-bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LUCA_BOT_PAT: ${{ secrets.LUCA_BOT_PAT }}
          DISCUSSION_NODE_ID: ${{ github.event.discussion.node_id }}
          DISCUSSION_NUMBER: ${{ github.event.discussion.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          TRIGGERING_BODY: ${{ github.event.comment.body }}
          DISCUSSION_TITLE: ${{ github.event.discussion.title }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          WEBSITE_ROOT: ${{ github.workspace }}
        run: python github_apply.py

  # ── capture ───────────────────────────────────────────────────────────────
  # Fires when tvc-amaffei posts "/luca capture".
  # Synthesises the thread into a community-qa.md entry; opens PR on luca-bot.
  capture:
    runs-on: ubuntu-latest
    if: |
      github.actor == 'tvc-amaffei' &&
      github.event_name == 'discussion_comment' &&
      startsWith(github.event.comment.body, '/luca capture')

    steps:
      - name: Checkout website repo
        uses: actions/checkout@v4.2.2
        with:
          repository: relations-foundation/relationsfoundation.org
          token: ${{ secrets.LUCA_BOT_PAT }}

      - name: Checkout luca-bot
        uses: actions/checkout@v4.2.2
        with:
          repository: relations-foundation/luca-bot
          path: luca-bot
          token: ${{ secrets.LUCA_BOT_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic
        working-directory: luca-bot

      - name: Run Luca capture
        working-directory: luca-bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LUCA_BOT_PAT: ${{ secrets.LUCA_BOT_PAT }}
          DISCUSSION_NODE_ID: ${{ github.event.discussion.node_id }}
          DISCUSSION_NUMBER: ${{ github.event.discussion.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          TRIGGERING_BODY: ${{ github.event.comment.body }}
          DISCUSSION_TITLE: ${{ github.event.discussion.title }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          WEBSITE_ROOT: ${{ github.workspace }}
        run: python github_capture.py

  # ── review-tick ───────────────────────────────────────────────────────────
  # Fires when a comment (or a first comment, arriving as a `discussion` event)
  # contains the review-pass phrase "<initials> reviewed #N". Ticks that page's
  # box in review-pass issue #N and closes it when every box is ticked. The
  # regex + reviewer allowlist live in github_review.py; this `contains()` is a
  # coarse pre-filter only. See luca-bot#19 § D7/D8.
  review-tick:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'discussion_comment' &&
      github.actor != 'github-actions[bot]' &&
      github.actor != 'giscus[bot]' &&
      !contains(github.event.comment.body, '<!-- luca-bot -->') &&
      contains(github.event.comment.body, 'reviewed #')

    steps:
      - name: Checkout luca-bot
        uses: actions/checkout@v4.2.2
        with:
          repository: relations-foundation/luca-bot
          token: ${{ secrets.LUCA_BOT_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic

      - name: Run Luca review-tick
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LUCA_BOT_PAT: ${{ secrets.LUCA_BOT_PAT }}
          DISCUSSION_NODE_ID: ${{ github.event.discussion.node_id }}
          DISCUSSION_NUMBER: ${{ github.event.discussion.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          TRIGGERING_BODY: ${{ github.event.comment.body || github.event.discussion.body }}
          DISCUSSION_TITLE: ${{ github.event.discussion.title }}
          COMMENT_NODE_ID: ${{ github.event.comment.node_id }}
          ACTOR: ${{ github.actor }}
        run: python github_review.py
